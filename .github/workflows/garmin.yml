name: Garmin

on:
  schedule:
    - cron: '30 4 * * *'   # ca. kl. 06.30 dansk sommertid
    - cron: '30 19 * * *'  # ca. kl. 21.30 dansk sommertid
  workflow_dispatch:
    inputs:
      mode:
        description: 'Hvad skal der ske?'
        type: choice
        options:
          - hent-data
        default: hent-data

permissions:
  contents: write

concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer biblioteker
        run: pip install --quiet garminconnect cryptography

      - name: Hent data fra Garmin Connect
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_PASSPHRASE: ${{ secrets.GARMIN_PASSPHRASE }}
        run: python scripts/garmin_sync.py

      - name: Gem garmin/data.json i repoet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garmin/data.json
          if git diff --cached --quiet; then
            echo "Ingen ændringer"
          else
            git commit -m "Garmin-data opdateret"
            git push
          fi
