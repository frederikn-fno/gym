name: Garmin

on:
  # Kl. 08, 12 og 21 dansk tid. GitHub regner i UTC, så hvert tidspunkt står der to gange:
  # én til sommertid og én til vintertid. Trinnet "Dansk tid?" springer den forkerte over.
  schedule:
    - cron: '0 6 * * *'    # 08 sommertid
    - cron: '0 7 * * *'    # 08 vintertid
    - cron: '0 10 * * *'   # 12 sommertid
    - cron: '0 11 * * *'   # 12 vintertid
    - cron: '0 19 * * *'   # 21 sommertid
    - cron: '0 20 * * *'   # 21 vintertid
  # Appen gemmer garmin/plan.json ("Send pas til uret"), garmin/refresh.json ("Hent nye data fra uret")
  # eller garmin/club.json (link til klubbens kampprogram).
  push:
    branches: [main]
    paths: ['garmin/plan.json', 'garmin/refresh.json', 'garmin/club.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Hvad skal der ske?'
        type: choice
        options:
          - hent-data
          - send-plan
        default: hent-data

permissions:
  contents: write

concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dansk tid?
        id: tid
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          case "$SCHED" in
            '0 6 * * *'|'0 10 * * *'|'0 19 * * *') want=+0200 ;;
            '0 7 * * *'|'0 11 * * *'|'0 20 * * *') want=+0100 ;;
            *) want=any ;;  # startet manuelt eller fra appen
          esac
          now=$(TZ=Europe/Copenhagen date +%z)
          if [ "$want" = any ] || [ "$want" = "$now" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "Springer over: forkert sommer-/vintertid"; fi

      - if: steps.tid.outputs.run == 'true'
        uses: actions/checkout@v4

      - if: steps.tid.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer biblioteker
        if: steps.tid.outputs.run == 'true'
        run: pip install --quiet garminconnect cryptography

      - name: Garmin Connect
        if: steps.tid.outputs.run == 'true'
        env:
          MODE: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'Pas til uret') && 'send-plan' || 'hent-data') || inputs.mode || 'hent-data' }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_PASSPHRASE: ${{ secrets.GARMIN_PASSPHRASE }}
          CLUB_ICAL_URL: ${{ secrets.CLUB_ICAL_URL }}  # valgfri: link til klubbens kalender (ellers garmin/club.json fra appen)
        run: python scripts/garmin_sync.py

      # Kører også, hvis afsendelsen fejlede, så appen kan vise fejlen (garmin/sent.json)
      - name: Gem i repoet
        if: always() && steps.tid.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in garmin/data.json garmin/sent.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Ingen ændringer"
          else
            git commit -m "Garmin opdateret"
            git pull --rebase --quiet  # appen kan have gemt plan.json imens
            git push
          fi
